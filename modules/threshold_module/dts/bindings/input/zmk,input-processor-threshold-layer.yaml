description: ZMK pointer movement threshold temporary-layer input processor

compatible: "zmk,input-processor-threshold-layer"

properties:
  threshold:
    type: int
    required: true
    description: Cumulative pointer movement required to activate the layer

  reset-timeout-ms:
    type: int
    default: 200
    description: Inactivity time before accumulated movement is reset

  track-remainders:
    type: boolean
    description: Whether movement below the threshold is accumulated

input-processor-cells:
  - layer
  - timeout-ms