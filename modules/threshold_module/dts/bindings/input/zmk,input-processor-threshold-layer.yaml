description: ZMK movement-threshold temporary layer input processor

compatible: "zmk,input-processor-threshold-layer"


properties:
  "#input-processor-cells":
    type: int
    const: 2

  movement-threshold:
    type: int
    required: true
    description: Total absolute X/Y movement required before activating the layer

input-processor-cells:
  - layer
  - timeout-ms
