description: ZMK pointer movement threshold temporary-layer input processor
compatible: "zmk,input-processor-threshold-layer"

properties:
  "#input-processor-cells":
    type: int
    const: 0

  layer:
    type: int
    required: true
    description: Layer index enabled after movement reaches the threshold

  timeout-ms:
    type: int
    required: true
    description: Time to keep the layer active after the last pointer event

  threshold:
    type: int
    required: true
    description: Accumulated absolute X/Y movement required before enabling the layer
