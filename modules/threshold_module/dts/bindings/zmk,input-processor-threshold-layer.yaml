description: |
  Temporary layer input processor with movement threshold.
  Activates a layer only after cumulative pointer movement exceeds a threshold.

compatible: "zmk,input-processor-threshold-layer"

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 2

  track-remainders:
    type: boolean
    description: Whether this input processor tracks movement remainders

  threshold:
    type: int
    default: 15
    description: Cumulative pointer movement required before layer activation

  reset-timeout-ms:
    type: int
    default: 200
    description: Inactivity time before accumulated movement is reset

input-processor-cells:
  - param1
  - param2
