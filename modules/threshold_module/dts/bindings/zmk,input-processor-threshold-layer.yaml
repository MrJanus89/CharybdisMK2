description: |
  ZMK input processor that activates a temporary layer only after
  cumulative relative pointer movement reaches a threshold.

compatible: "zmk,input-processor-threshold-layer"

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 2

  threshold:
    type: int
    default: 16
    description: Cumulative absolute X/Y movement required to activate the layer

  reset-timeout-ms:
    type: int
    default: 200
    description: Inactivity duration before pre-threshold accumulated movement resets

input-processor-cells:
  - param1
  - param2
