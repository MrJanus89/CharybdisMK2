description: Activates a temporary ZMK layer after cumulative pointer movement

compatible: "zmk,input-processor-threshold-layer"

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 2

  threshold:
    type: int
    default: 16

  reset-timeout-ms:
    type: int
    default: 200

input-processor-cells:
  - param1
  - param2
