description: Activates a temporary ZMK layer after sustained relative pointer movement

compatible: "zmk,input-processor-threshold-layer"

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 2

  threshold:
    type: int
    default: 16
    description: Minimum cumulative absolute X/Y movement before activation

  activation-delay-ms:
    type: int
    default: 300
    description: Movement must remain continuous for at least this duration

  movement-gap-ms:
    type: int
    default: 80
    description: Maximum allowed gap between movement events before continuity resets

input-processor-cells:
  - param1
  - param2
