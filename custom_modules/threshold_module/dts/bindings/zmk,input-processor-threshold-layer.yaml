description: ZMK input processor that activates a layer after sustained pointer movement

compatible: "zmk,input-processor-threshold-layer"

include: base.yaml

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 2

  threshold:
    type: int
    required: true
    description: Minimum accumulated pointer movement before activation

  activation-delay-ms:
    type: int
    required: true
    description: Continuous movement duration required before layer activation

  movement-gap-ms:
    type: int
    required: true
    description: Maximum allowed gap between movement events before reset

  track-remainders:
    type: boolean
    description: Enable remainder tracking required by the ZMK input listener
