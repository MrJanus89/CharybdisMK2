description: |
  ZMK input processor that observes relative X/Y movement and activates a
  temporary layer after both a movement threshold and activation delay are met.
  An incomplete movement sequence resets after movement-gap-ms of inactivity.

compatible: "zmk,input-processor-threshold-layer"

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 2

  threshold:
    type: int
    default: 128
    description: Sum of absolute relative X/Y counts required for activation

  movement-gap-ms:
    type: int
    default: 100
    description: Inactivity gap that resets pending movement and delay state

  activation-delay-ms:
    type: int
    default: 0
    description: Continuous movement-sequence duration required before activation

  track-remainders:
    type: boolean
    description: Compatibility flag accepted for existing keymaps; this observer processor does not modify pointer remainders

input-processor-cells:
  - param1
  - param2
