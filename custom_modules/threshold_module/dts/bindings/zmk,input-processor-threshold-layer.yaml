description: |
  Activates a temporary ZMK layer after cumulative relative pointer
  movement reaches the configured threshold.

compatible: "zmk,input-processor-threshold-layer"

properties:
  "#input-processor-cells":
    type: int
    required: true
    const: 2

  threshold:
    type: int
    default: 16
    description: Cumulative absolute X and Y movement before layer activation

  reset-timeout-ms:
    type: int
    default: 200
    description: Inactivity time before incomplete movement accumulation resets

input-processor-cells:
  - param1
  - param2
