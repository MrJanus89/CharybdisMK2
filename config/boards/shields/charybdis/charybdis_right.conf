CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y
CONFIG_ZMK_EXT_POWER=y

# nice!nano VCC may not be ready when the PMW3610 driver starts.
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# USB-first diagnostic setting. 8 ms is supported by the zmk-0.3 driver.
CONFIG_PMW3610_REPORT_INTERVAL_MIN=8
CONFIG_PMW3610_SMART_ALGORITHM=y

CONFIG_INPUT_THREAD_STACK_SIZE=2048
