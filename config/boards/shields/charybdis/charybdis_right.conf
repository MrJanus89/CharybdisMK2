CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_PMW3610=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# PMW3610 settings supported by the current inorichi driver
CONFIG_PMW3610_CPI=800
CONFIG_PMW3610_CPI_DIVIDOR=2
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_ORIENTATION_90=y
CONFIG_PMW3610_INVERT_X=y

# Custom sustained-movement layer processor
CONFIG_ZMK_INPUT_PROCESSOR_THRESHOLD_LAYER=y
