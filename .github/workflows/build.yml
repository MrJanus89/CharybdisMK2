name: Build ZMK firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect required files
        shell: bash
        run: |
          set -euxo pipefail
          test -f config/west.yml
          test -f config/charybdis.keymap
          test -f config/charybdis.conf
          test -f config/boards/shields/charybdis/Kconfig.shield
          test -f config/boards/shields/charybdis/charybdis_left.overlay
          test -f config/boards/shields/charybdis/charybdis_right.overlay
          test -f custom_modules/threshold_module/zephyr/module.yml
          find config/boards/shields/charybdis -maxdepth 1 -type f -print | sort
          find custom_modules/threshold_module -type f -print | sort

  build:
    needs: inspect
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
